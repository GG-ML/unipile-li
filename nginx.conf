events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    upstream outreach_api {
        # FastAPI service in docker-compose
        server api:8000;
    }

    # Default server — deny unknown hosts
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }

    # HTTP server — redirect to HTTPS (linkedin-server.libingo.io)
    server {
        listen 80;
        server_name linkedin-server.libingo.io;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name linkedin-server.libingo.io;

        # SSL certificates (self-signed or Let's Encrypt symlinks)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API endpoints
        location /api/ {
            proxy_pass http://outreach_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for long-running Unipile calls
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # Strip upstream CORS headers to prevent duplicates
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;

            # Set CORS origin based on request
            set $cors_origin "";
            if ($http_origin = "https://app.libingo.io") {
                set $cors_origin "https://app.libingo.io";
            }
            if ($http_origin = "https://salesday.daysai.co") {
                set $cors_origin "https://salesday.daysai.co";
            }
            if ($http_origin = "https://app.hiringday.ai") {
                set $cors_origin "https://app.hiringday.ai";
            }
            if ($http_origin = "https://localhost:3000") {
                set $cors_origin "https://localhost:3000";
            }
            if ($http_origin = "http://localhost:3000") {
                set $cors_origin "http://localhost:3000";
            }

            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            # CORS headers for multiple origins
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        }

        # FastAPI docs
        location /docs {
            proxy_pass http://outreach_api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            set $cors_origin "";
            if ($http_origin = "https://app.libingo.io") {
                set $cors_origin "https://app.libingo.io";
            }
            if ($http_origin = "https://salesday.daysai.co") {
                set $cors_origin "https://salesday.daysai.co";
            }
            if ($http_origin = "https://app.hiringday.ai") {
                set $cors_origin "https://app.hiringday.ai";
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # OpenAPI schema
        location /openapi.json {
            proxy_pass http://outreach_api/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            set $cors_origin "";
            if ($http_origin = "https://app.libingo.io") {
                set $cors_origin "https://app.libingo.io";
            }
            if ($http_origin = "https://salesday.daysai.co") {
                set $cors_origin "https://salesday.daysai.co";
            }
            if ($http_origin = "https://app.hiringday.ai") {
                set $cors_origin "https://app.hiringday.ai";
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # Health endpoint
        location /health {
            proxy_pass http://outreach_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            set $cors_origin "";
            if ($http_origin = "https://app.libingo.io") {
                set $cors_origin "https://app.libingo.io";
            }
            if ($http_origin = "https://salesday.daysai.co") {
                set $cors_origin "https://salesday.daysai.co";
            }
            if ($http_origin = "https://app.hiringday.ai") {
                set $cors_origin "https://app.hiringday.ai";
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # Root endpoint
        location / {
            proxy_pass http://outreach_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            set $cors_origin "";
            if ($http_origin = "https://app.libingo.io") {
                set $cors_origin "https://app.libingo.io";
            }
            if ($http_origin = "https://salesday.daysai.co") {
                set $cors_origin "https://salesday.daysai.co";
            }
            if ($http_origin = "https://app.hiringday.ai") {
                set $cors_origin "https://app.hiringday.ai";
            }
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # Deny access to .htaccess files
        location ~ /\.ht {
            deny all;
        }
    }
}
